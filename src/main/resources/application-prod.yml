spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sfmp}
    username: ${SPRING_DATASOURCE_USERNAME:sfmp}
    password: ${SPRING_DATASOURCE_PASSWORD:sfmp}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
  bucket: ${S3_BUCKET:sfmp-media}
