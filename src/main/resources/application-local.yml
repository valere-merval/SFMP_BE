spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sfmp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.smartfan: DEBUG

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
  bucket: ${S3_BUCKET:sfmp-media}
