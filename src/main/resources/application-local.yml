spring:
  datasource:
    url: jdbc:h2:mem:sfmp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.smartfan: DEBUG
