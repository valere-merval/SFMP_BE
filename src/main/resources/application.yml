spring:
  application:
    name: smart-fan-mobility
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

openai:
  model: ${OPENAI_MODEL:gpt-5.3-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
