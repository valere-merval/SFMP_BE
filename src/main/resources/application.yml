spring:
  application:
    name: smart-fan-mobility
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    properties:
      hibernate:
        default_schema: sfmp
  flyway:
    default-schema: sfmp
    schemas: sfmp
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    listener:
      missing-topics-fatal: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:sfmp-behavior-events}
      auto-offset-reset: earliest
    producer:
      acks: all
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sfmp}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

openai:
  remote-enabled: ${OPENAI_REMOTE_ENABLED:true}
  model: ${OPENAI_MODEL:gpt-5.3-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
  bucket: ${S3_BUCKET:sfmp-media}

app:
  telemetry:
    enabled: ${APP_TELEMETRY_ENABLED:false}
    topic: ${TELEMETRY_TOPIC:sfmp.behavior-events}
    mongo-enabled: ${TELEMETRY_MONGO_ENABLED:true}
    kafka-consumer-enabled: ${TELEMETRY_KAFKA_CONSUMER_ENABLED:false}
