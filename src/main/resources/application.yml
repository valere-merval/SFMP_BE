spring:
  application:
    name: smart-fan-mobility
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

openai:
  model: ${OPENAI_MODEL:gpt-5.3-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
  bucket: ${S3_BUCKET:sfmp-media}
